
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FxLink</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>FxLink</h1>
      <span class="version">v0.2.0</span>
    </header>

    <p class="description">
      Automatically convert Twitter links to FxTwitter.
    </p>

    <section class="setting">
      <div>
        <strong>Automatic conversion</strong>
        <p id="status">Loading...</p>
      </div>

      <label class="switch">
        <input type="checkbox" id="enabledToggle">
        <span class="slider"></span>
      </label>
    </section>

    <footer>
      <span>Twitter → FxTwitter</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
